<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020611" />
    <title>3D 水晶生日倒计时</title>
    <link rel="stylesheet" href="styles.css?v=20260905e" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="experience is-loading" id="experience">
      <div class="scene-root" id="sceneRoot" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="scene-grain" aria-hidden="true"></div>

      <div class="loading-screen" id="loadingScreen" aria-live="polite">
        <span class="loading-mark" aria-hidden="true"></span>
        <p>正在点亮水晶空间</p>
      </div>

      <header class="topbar">
        <div class="brand">
          <strong>2026 Crystal Dreams</strong>
          <span>Birthday Countdown</span>
        </div>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">
          <span class="sound-dot" aria-hidden="true"></span>
          <span id="soundLabel">BGM ON</span>
        </button>
      </header>

      <section class="opening" id="opening">
        <p class="eyebrow">For Xiao Yang</p>
        <h1>让生日倒计时<br />在水晶光里开始</h1>
        <p class="opening-copy">小杨同学，准备好接住这一刻。</p>
        <button class="primary-action" id="startButton" type="button">开始倒计时</button>
      </section>

      <section class="countdown-hud" id="countdownHud" aria-hidden="true">
        <p class="ready-line" id="readyLine">你准备好了吗？</p>
        <p class="phase-line" id="phaseLine"></p>
      </section>

      <section class="finish-panel" id="finishPanel" aria-hidden="true">
        <p class="eyebrow">The Moment Is Yours</p>
        <h2>生日快乐，小杨同学</h2>
        <p>愿新的一岁，所有光都温柔地落在你身上。</p>
      </section>

      <div class="sr-only" id="liveCountdown" aria-live="assertive"></div>

      <audio id="countdownAudio" preload="auto" loop>
        <source src="assets/countdown-background.m4a" type="audio/mp4" />
      </audio>

      <div class="webgl-fallback" id="webglFallback" hidden>
        <h2>水晶场景暂时无法显示</h2>
        <p>请使用已开启硬件加速的新版 Edge、Chrome 或 Safari 浏览器。</p>
      </div>
    </main>

    <script type="module" src="app.js?v=20260905e"></script>
  </body>
</html>
